# Pre-commit hooks for har-capture
# Install: pre-commit install
# Run all: pre-commit run --all-files
# Update: pre-commit autoupdate

default_language_version:
  python: python3

repos:
  # ==========================================================================
  # General hooks
  # ==========================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]  # Allow custom tags
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  # ==========================================================================
  # Ruff - Linting & Formatting
  # ==========================================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4
    hooks:
      # Run the linter
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      # Run the formatter
      - id: ruff-format

  # ==========================================================================
  # Type checking
  # ==========================================================================
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        # Exactly the `cli` and `capture` extras, so the hook type-checks
        # against what CI installs (tests/test_tooling.py enforces this).
        # Strictness comes from [tool.mypy] in pyproject.toml, as in CI.
        additional_dependencies:
          - typer>=0.15.4
          - InquirerPy>=0.3.0
          - rich>=13.0.0
          - playwright>=1.40
        pass_filenames: false
        entry: mypy src/

  # ==========================================================================
  # Security
  # ==========================================================================
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: (tests/.*|\.har$|\.har\.gz$)

  # ==========================================================================
  # Commit message
  # ==========================================================================
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.27.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # ==========================================================================
  # Pre-push: Tag protection & CI checks
  # ==========================================================================
  - repo: local
    hooks:
      - id: verify-tag-ci
        name: Verify CI passed before tag push
        entry: ./scripts/verify-tag-ci.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: ci-local
        name: ci-local
        entry: ./scripts/ci-local.sh --matrix
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  # ==========================================================================
  # Documentation
  # ==========================================================================
  - repo: https://github.com/executablebooks/mdformat
    rev: 0.7.17
    hooks:
      - id: mdformat
        # --wrap 120 enforces the same line-length as markdownlint MD013.
        # The two tools work together: mdformat wraps on commit, markdownlint
        # catches anything mdformat couldn't auto-fix (very long unbreakable
        # tokens, etc).
        args: ["--wrap", "120"]
        additional_dependencies:
          - mdformat-gfm
          - mdformat-tables
          # Required so YAML frontmatter in GitHub issue templates is not
          # collapsed to a horizontal rule. Without this, mdformat re-damages
          # .github/ISSUE_TEMPLATE/*.md every commit.
          - mdformat-frontmatter

  # markdownlint catches what mdformat doesn't (bare URLs, trailing
  # punctuation in headings, raw-HTML allowlist, etc). Rule disables and
  # the allowlist of HTML elements live in .markdownlint.jsonc. Ignore
  # patterns (build artifacts, .venv, etc) live in .markdownlint-cli2.jsonc.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.22.1
    hooks:
      - id: markdownlint-cli2

# CI configuration
ci:
  autofix_commit_msg: "style: auto-fix by pre-commit hooks"
  autofix_prs: true
  autoupdate_branch: main
  autoupdate_commit_msg: "chore: update pre-commit hooks"
  autoupdate_schedule: weekly
